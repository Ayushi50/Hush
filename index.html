<style>
:root{--ink:#f4eefc;--soft:rgba(244,238,252,.68);--glass:rgba(18,16,46,.5);--line:rgba(255,255,255,.14);--accent:#ffd9a0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070a24;overflow:hidden;font-family:Quicksand,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;z-index:3;pointer-events:none}
.brand{font-weight:600;letter-spacing:.34em;font-size:13px;opacity:.7}
#snd{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#snd svg{width:19px;height:19px}
#cueWrap{position:fixed;left:0;right:0;top:15%;text-align:center;z-index:2;pointer-events:none;padding:0 28px}
#cue{font-size:clamp(26px,7.2vw,42px);font-weight:500;letter-spacing:.01em;text-shadow:0 2px 26px rgba(10,10,40,.7);min-height:1.2em}
#sub{margin:8px auto 0;font-size:15px;color:var(--soft);min-height:1.4em;max-width:330px;line-height:1.45;text-shadow:0 1px 14px rgba(10,10,40,.8)}
#sub.big{font-size:22px;font-weight:600;color:var(--accent);letter-spacing:.05em}
.pop{animation:pop .8s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3;pointer-events:none}
#bottom > *{pointer-events:auto}
nav{display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav button{font:inherit;font-weight:600;font-size:14px;color:var(--soft);background:none;border:0;padding:11px 15px;border-radius:999px;cursor:pointer;transition:background .35s,color .35s}
nav button.on{background:rgba(255,255,255,.15);color:var(--ink)}
.hidden{display:none!important}
#chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--soft);cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.3s}
.chip span{opacity:.6;font-size:11px;margin-left:3px;font-weight:500}
.chip.on{border-color:rgba(255,217,160,.65);color:var(--ink);background:rgba(255,217,160,.1)}
#letgo{display:flex;gap:6px;width:min(440px,100%)}
#worry{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--ink);outline:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-user-select:text;user-select:text}
#worry::placeholder{color:var(--soft)}
#worry:focus{border-color:rgba(255,217,160,.6)}
#letgo button{font:inherit;font-weight:700;font-size:15px;padding:12px 20px;border-radius:999px;border:0;background:linear-gradient(180deg,#ffd9a0,#ff9e74);color:#3a1d18;cursor:pointer;box-shadow:0 4px 24px rgba(255,160,110,.35)}
#games{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(440px,100%)}
.card{--c:#ffb37a;font:inherit;text-align:left;padding:12px 12px 12px 46px;position:relative;border-radius:18px;background:var(--glass);border:1px solid var(--line);color:var(--ink);cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:border-color .3s}
.card:active{border-color:var(--c)}
.card::before{content:'';position:absolute;left:15px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff 0,var(--c) 50%,transparent 74%);box-shadow:0 0 18px var(--c)}
.card b{display:block;font-size:14px;font-weight:700}
.card span{display:block;font-size:12px;color:var(--soft);margin-top:2px;line-height:1.3}
#gamebar{display:flex;gap:6px;pointer-events:auto}
#intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;padding:30px;background:radial-gradient(ellipse at center,rgba(7,10,36,.35),rgba(7,10,36,.8));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:opacity 1.2s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{font-weight:500;font-size:clamp(48px,14vw,76px);letter-spacing:.22em;margin-right:-.22em;text-shadow:0 0 40px rgba(180,255,230,.35)}
#intro p{color:var(--soft);font-size:16px;line-height:1.55;max-width:320px;margin:10px auto 0}
#begin{margin-top:30px;font:inherit;font-weight:700;font-size:17px;padding:15px 44px;border-radius:999px;border:0;cursor:pointer;color:#16303a;background:linear-gradient(180deg,#d8fff0,#8fe0c6);box-shadow:0 0 40px rgba(143,224,198,.45);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 60px rgba(143,224,198,.75);transform:scale(1.04)}}
#intro small{display:block;margin-top:18px;color:var(--soft);font-size:13px;opacity:.8}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div class="brand">HUSH</div>
  <div id="gamebar" class="hidden">
    <button class="chip" id="backGames">&#8249; Games</button>
    <button class="chip hidden" id="clearSky">New sky</button>
  </div>
  <button id="snd" aria-label="Toggle sound"></button>
</div>

<div id="cueWrap"><div id="cue"></div><div id="sub"></div></div>

<div id="bottom">
  <div id="chips">
    <button class="chip on" data-p="calm">Calm<span>4·2·6</span></button>
    <button class="chip" data-p="box">Box<span>4·4·4·4</span></button>
    <button class="chip" data-p="sleep">Sleep<span>4·7·8</span></button>
  </div>
  <form id="letgo" class="hidden" autocomplete="off">
    <input id="worry" maxlength="60" placeholder="What's weighing on you?" enterkeyhint="send">
    <button type="submit">Release</button>
  </form>
  <div id="games" class="hidden">
    <button class="card" data-g="koi" style="--c:#ff9a5c"><b>Koi Pond</b><span>Feed the gentle fish</span></button>
    <button class="card" data-g="echo" style="--c:#f7a8c8"><b>Echo</b><span>Hum Lumi's song back</span></button>
    <button class="card" data-g="bubbles" style="--c:#9fdcff"><b>Bubbles</b><span>Pop drifting glow orbs</span></button>
    <button class="card" data-g="stars" style="--c:#ffe3a3"><b>Stargazer</b><span>Draw your own constellations</span></button>
  </div>
  <nav>
    <button data-m="breathe" class="on">Breathe</button>
    <button data-m="drift">Drift</button>
    <button data-m="letgo">Let go</button>
    <button data-m="games">Games</button>
  </nav>
</div>

<div id="intro">
  <div>
    <h1>hush</h1>
    <p>A quiet night pond. Meet Lumi, a little pond spirit who breathes with you, gathers fireflies, and carries worries up to the stars.</p>
    <button id="begin">Begin</button>
    <small>Best with headphones · nothing to win, nothing to lose</small>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,HZ=0,bg=null;
let mode='breathe',pattern='calm',started=false;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=p=>0.5-0.5*Math.cos(Math.PI*p);
const easeOut=p=>1-Math.pow(1-p,3);

/* ---------- glow sprites ---------- */
function sprite(r,g,b){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const gr=x.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.22,`rgba(${r},${g},${b},.42)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gr;x.fillRect(0,0,128,128);return c}
const GW=sprite(255,212,140),GM=sprite(165,255,222),GP=sprite(255,165,200),GS=sprite(255,244,224),GB=sprite(160,215,255);
const ECHO_RGB=[[255,158,181],[255,194,122],[255,236,140],[150,238,198],[150,196,255]];
const GE=ECHO_RGB.map(c=>sprite(...c));
const kS=()=>clamp(Math.min(W,H)/420,.8,1.4);
function glow(img,x,y,s,a){if(a<=0||s<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(img,x-s,y-s,s*2,s*2);ctx.globalAlpha=1}
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2)}

/* ---------- world state ---------- */
const stars=[];for(let i=0;i<140;i++)stars.push({rx:Math.random(),ry:Math.pow(Math.random(),1.3)*.93,s:rand(.4,1.5),ph:rand(0,6.28),sp:rand(.4,1.8)});
const myStars=[],pads=[],lotuses=[],ripples=[],flies=[],lanterns=[],sparks=[],shooters=[];
let lotusCount=0,nextShoot=performance.now()+6000;
for(let i=0;i<7;i++){let rx,rd,t=0;do{rx=rand(.05,.95);rd=rand(.05,.6);t++}while(Math.abs(rx-.5)<.2&&Math.abs(rd-.36)<.2&&t<30);pads.push({rx,rd,rot:rand(0,6.28),s:rand(.8,1.3)})}
[[.18,.22],[.82,.42],[.3,.55]].forEach(([rx,rd])=>lotuses.push({rx,rd,t0:-1e5,s:rand(.85,1.1),rot:rand(0,6.28)}));

const L={sq:0,blinkAt:0,nextBlink:2000,lx:0,ly:0,cx:0,cy:0,r:30};
const lumiBase=()=>clamp(Math.min(W,H)*.075,26,56);
const lumiPadY=()=>HZ+(H-HZ)*.36;

function newFly(fade){return{x:rand(0,W),y:rand(H*.1,H*.86),a:rand(0,6.28),sp:rand(10,22),ph:rand(0,6.28),s:rand(7,12),st:'fly',al:fade?0:1}}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);HZ=H*.56;
  buildBg();
  const n=W<600?28:42;while(flies.length<n)flies.push(newFly(false));while(flies.length>n)flies.pop();
  flies.forEach(f=>{f.x=clamp(f.x,0,W);f.y=clamp(f.y,H*.1,H*.86)});
}
function hills(g,base,amp,color,freq,seed){g.beginPath();g.moveTo(0,base);for(let x=0;x<=W+4;x+=4){const k=x/W;g.lineTo(x,base-amp*(.55+.25*Math.sin(k*Math.PI*freq*2+seed)+.15*Math.sin(k*Math.PI*freq*5.3+seed*2)+.05*Math.sin(k*40+seed)))}g.lineTo(W,base);g.closePath();g.fillStyle=color;g.fill()}
function buildBg(){
  bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;const g=bg.getContext('2d');g.scale(DPR,DPR);
  const sky=g.createLinearGradient(0,0,0,HZ);sky.addColorStop(0,'#070a24');sky.addColorStop(.45,'#1b1b4b');sky.addColorStop(.8,'#46336d');sky.addColorStop(1,'#a8678a');
  g.fillStyle=sky;g.fillRect(0,0,W,HZ+1);
  const hg=g.createRadialGradient(W*.5,HZ,0,W*.5,HZ,Math.max(W,H)*.7);hg.addColorStop(0,'rgba(255,190,150,.3)');hg.addColorStop(1,'rgba(255,190,150,0)');g.fillStyle=hg;g.fillRect(0,0,W,HZ);
  hills(g,HZ,H*.075,'#2b2357',1.3,.2);hills(g,HZ,H*.045,'#1a1740',2.1,1.7);
  const wg=g.createLinearGradient(0,HZ,0,H);wg.addColorStop(0,'#3a2c5e');wg.addColorStop(.1,'#1c1c47');wg.addColorStop(1,'#060920');g.fillStyle=wg;g.fillRect(0,HZ,W,H-HZ);
  g.save();g.translate(0,2*HZ);g.scale(1,-1);g.globalAlpha=.28;hills(g,HZ,H*.075,'#2b2357',1.3,.2);hills(g,HZ,H*.045,'#141236',2.1,1.7);g.restore();
  g.fillStyle='rgba(255,215,195,.2)';g.fillRect(0,HZ,W,1);
}

/* ---------- audio ---------- */
const A={ctx:null,master:null,dry:null,verb:null,padF:null,on:true,lastF:0};
function impulse(ac,sec,decay){const len=ac.sampleRate*sec|0,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
function lfo(ac,rate,depth,param){const o=ac.createOscillator();o.frequency.value=rate;const g=ac.createGain();g.gain.value=depth;o.connect(g);g.connect(param);o.start()}
function initAudio(){
  if(A.ctx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ac=new AC();A.ctx=ac;
    const m=ac.createGain();m.gain.value=0;m.connect(ac.destination);A.master=m;
    const dry=ac.createGain();dry.gain.value=.7;dry.connect(m);A.dry=dry;
    const conv=ac.createConvolver();conv.buffer=impulse(ac,4,2.6);const wet=ac.createGain();wet.gain.value=.55;conv.connect(wet);wet.connect(m);A.verb=conv;
    // warm pad (D add9)
    const pf=ac.createBiquadFilter();pf.type='lowpass';pf.frequency.value=650;pf.Q.value=.6;A.padF=pf;
    const pg=ac.createGain();pg.gain.value=.16;pf.connect(pg);pg.connect(dry);pg.connect(conv);
    [73.42,110,146.83,185,220,329.63].forEach((f,i)=>{
      const vg=ac.createGain();vg.gain.value=i<2?.07:.045;vg.connect(pf);
      lfo(ac,rand(.04,.12),i<2?.025:.03,vg.gain);
      [-7,7].forEach(dt=>{const o=ac.createOscillator();o.type=i<2?'sine':'triangle';o.frequency.value=f;o.detune.value=dt;o.connect(vg);o.start()});
    });
    // soft water
    const len=ac.sampleRate*6,nb=ac.createBuffer(1,len,ac.sampleRate),d=nb.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5}
    const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;
    const nf=ac.createBiquadFilter();nf.type='lowpass';nf.frequency.value=480;
    const ng=ac.createGain();ng.gain.value=.055;lfo(ac,.07,.03,ng.gain);lfo(ac,.05,160,nf.frequency);
    ns.connect(nf);nf.connect(ng);ng.connect(dry);ns.start();
    m.gain.setTargetAtTime(A.on?.85:0,ac.currentTime,1.2);
  }catch(e){A.ctx=null}
}
function chime(f,vol=.12,dur=2.8,delay=0){
  if(!A.ctx||!A.on)return;const ac=A.ctx,t=ac.currentTime+delay;
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const o=ac.createOscillator();o.type='sine';o.frequency.value=f;
  const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*2.003;const g2=ac.createGain();g2.gain.value=.16;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(A.dry);g.connect(A.verb);
  o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
}
// brighter bell with overtones, so it carries on small phone speakers
function bell(f,vol=.16,dur=2.6,delay=0){
  if(!A.ctx||!A.on)return;const ac=A.ctx,t=ac.currentTime+delay;
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  g.connect(A.dry);g.connect(A.verb);

}

const kois=[],food=[];let fed=0;

function dropFood(x,y){y=clamp(y,waterTop()+6,waterBot());food.push({x,y,t0:performance.now()});if(food.length>14)food.shift();ripple(x,y,.6);chime(noteAt(x),.06,1.8)}
function updateKoi(dt,now){
  const top=waterTop(),bot=waterBot();

    const h=q.pts[0],d=clamp((h.y-HZ)/(H-HZ),0,1),sc=(.55+d*.9)*kS();
    let best=null,bd=1e9;for(const f of food){if(f.eaten)continue;const dd=Math.hypot(f.x-h.x,f.y-h.y);if(dd<bd){bd=dd;best=f}}

      if(fed%6===0)setCue(pick(AFFIRM));subEl.classList.remove('big');subEl.textContent=fed+(fed===1?' little snack':' little snacks')+' shared — the koi say thank you.'}
  }

function drawKoi(q,now){
  const pts=q.pts,n=pts.length,h=pts[0],d=clamp((h.y-HZ)/(H-HZ),0,1),sc=(.55+d*.9)*kS(),W0=7*sc,Lp=[],Rp=[];
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=a.x-b.x,dy=a.y-b.y;const dl=Math.hypot(dx,dy)||1;const nx=-dy/dl,ny=dx/dl,t=i/(n-1),w=W0*(t<.2?.7+1.5*t:1-((t-.2)/.8)*.85);Lp.push([pts[i].x+nx*w,pts[i].y+ny*w]);Rp.push([pts[i].x-nx*w,pts[i].y-ny*w])}

}

/* --- Echo (forgiving memory song) --- */
const ECHO_N=[587.33,739.99,880,1174.66,1479.98];
const echo={seq:[],pos:0,state:'idle',lit:[-1e5,-1e5,-1e5,-1e5,-1e5],token:0};
function echoPads(){const bot=Math.min(HZ+(H-HZ)*.72,H-120),arc=(H-HZ)*.09,R=clamp(W*.06,20,40),arr=[];for(let i=0;i<5;i++){const t=i/4;arr.push({x:W*(.13+.74*t),y:bot-Math.sin(Math.PI*t)*arc,R})}return arr}

function playSeq(delay){
  const tok=++echo.token;echo.state='listen';echo.pos=0;
  echo.seq.forEach((p,i)=>setTimeout(()=>{if(tok!==echo.token||mode!=='echo')return;lightPad(p);L.sq=.55},delay+i*780));
  setTimeout(()=>{if(tok!==echo.token||mode!=='echo')return;echo.state='play';setCue('Your turn','Tap the lights in the same order. ('+echo.seq.length+' notes)'+(audioOK()?'':' \u2014 sound seems off: tap the speaker icon, and on iPhone check the silent switch.'))},delay+echo.seq.length*780+250);
}
function tapEcho(x,y){
  const pads=echoPads();let hit=-1;pads.forEach((p,i)=>{if(Math.hypot(x-p.x,(y-p.y)/.55)<p.R*1.5)hit=i});
  if(hit<0)return false;lightPad(hit);if(echo.state!=='play')return true;
  if(hit===echo.seq[echo.pos]){
    echo.pos++;
    if(echo.pos===echo.seq.length){
      echo.state='wait';L.sq=1;pads.forEach((p,i)=>burst(p.x,p.y-p.R*.3,4,GE[i]));[0,2,4].forEach((k,j)=>bell(ECHO_N[k],.07,3,.35+j*.12));

      else{setCue(pick(['Lovely.','Beautiful.','Just like that.','So gentle.']),'The song grows one note longer…');echo.seq.push(Math.random()*5|0);playSeq(2000)}
    }

  return true;
}
function startEchoLater(){const tok=++echo.token;setTimeout(()=>{if(tok===echo.token&&mode==='echo')startEcho()},2600)}
function drawEchoPad(p,i,now){

  drawPad(p.x,p.y,p.R*1.25,p.R*.45,.3+i,'#21524b');
  const oy=p.y-p.R*.28-lit*p.R*.12;
  ctx.globalCompositeOperation='lighter';glow(GE[i],p.x,oy,p.R*(1.1+2.4*lit),.35+.6*lit);ctx.globalCompositeOperation='source-over';
  const gr=ctx.createRadialGradient(p.x-p.R*.1,oy-p.R*.12,1,p.x,oy,p.R*.36);gr.addColorStop(0,'#fff');gr.addColorStop(1,`rgba(${r},${g},${b},${.75+.25*lit})`);

    if(ln.y<=ln.ty){myStars.push({rx:ln.x/W,ry:ln.y/HZ,ph:rand(0,6),t0:now});if(myStars.length>60)myStars.shift();burst(ln.x,ln.y,14,GW);chime(1174.66,.06,3);chime(1760,.035,3,.08);if(mode==='letgo')setCue('It’s only a distant star now.','Quiet, small, and far away. Release another whenever you like.');lanterns.splice(i,1);continue}
    drawLantern(ln,now)}
  // bubbles
  updateBubbles(dt,now);bubbles.forEach(b=>drawBubble(b,now));
  // fireflies
  const attract=started&&['drift','breathe','games'].includes(mode)&&(ptr.down||(ptr.type==='mouse'&&now-ptr.t<1500));
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<flies.length;i++){const f=flies[i];
    if(f.st==='fly'){
      f.a+=(Math.random()-.5)*2.2*dt;let vx=Math.cos(f.a)*f.sp,vy=Math.sin(f.a)*f.sp*.6;
      if(attract&&mode!=='letgo'){const dx=ptr.x-f.x,dy=ptr.y-f.y,d=Math.hypot(dx,dy)||1;if(d<190){const k=(1-d/190)*70;vx+=dx/d*k;vy+=dy/d*k}
        if(mode==='drift'&&d<30){f.st='fall';f.t=0;f.sx=f.x;f.sy=f.y;let ty=f.y<HZ+12?HZ+rand(.08,.6)*(H-HZ):Math.min(f.y+rand(5,20),HZ+(H-HZ)*.7),tx=f.x;
          if(Math.abs(tx-W/2)<lumiBase()*2.4&&Math.abs(ty-lumiPadY())<lumiBase()*1.2)tx+=(tx<W/2?-1:1)*lumiBase()*2.6;f.tx=clamp(tx,20,W-20);f.ty=ty;chime(1318.5,.04,1.2);}}
      f.x+=vx*dt;f.y+=vy*dt;
      if(f.x<-20)f.x=W+20;if(f.x>W+20)f.x=-20;if(f.y<H*.08){f.y=H*.08;f.a=rand(.4,2.7)}if(f.y>H*.9){f.y=H*.9;f.a=rand(-2.7,-.4)}
      if(f.al<1)f.al=Math.min(1,f.al+dt*.5);
    }else{f.t+=dt/1.3;const p=ease(Math.min(1,f.t));f.x=lerp(f.sx,f.tx,p);f.y=lerp(f.sy,f.ty,p)-Math.sin(Math.PI*p)*30;if(f.t>=1){bloom(f.tx,f.ty,now);flies[i]=newFly(true);continue}}
    const fl=(.55+.45*Math.sin(now*.003+f.ph))*f.al;glow(GW,f.x,f.y,f.s*(f.st==='fall'?1.6:1),fl*.9);ctx.fillStyle=`rgba(255,248,210,${fl})`;ctx.beginPath();ctx.arc(f.x,f.y,1.6,0,6.283);ctx.fill()}
  // sparks
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt*.9;if(s.life<=0){sparks.splice(i,1);continue}s.vx*=.96;s.vy=s.vy*.96+8*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;glow(s.img,s.x,s.y,s.sz*s.life,s.life)}
  ctx.globalCompositeOperation='source-over';
  drawWords(now);
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
})();
